<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Login — First Wake Media</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/portal.css">
</head>
<body class="portal-body">
  <a class="skip-link" href="#main">Skip to login</a>
  <main class="portal-shell" id="main">
    <section class="portal-card" aria-labelledby="login-title">
      <a class="brand portal-brand" href="/">
        <img class="brand__mark" src="/logo-emblem.png" width="160" height="160" alt="">
        <span class="brand__name">First Wake<small>Media</small></span>
      </a>
      <span class="eyebrow">Client portal</span>
      <h1 id="login-title">Welcome back.</h1>
      <p class="portal-copy">Sign in with your password, or request a secure sign-in link by email.</p>

      <form class="portal-form" id="login-form">
        <div class="portal-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@yourbusiness.com">
        </div>
        <div class="portal-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        </div>
        <button class="btn btn--primary btn--lg" type="submit" id="login-button">Sign in</button>
        <button class="btn btn--secondary btn--lg" type="button" id="magic-link-button">Email me a sign-in link</button>
        <button class="btn btn--secondary btn--lg" type="button" id="account-mode-button">Create account</button>
      </form>
      <p class="portal-status" id="login-status" role="status" aria-live="polite"></p>
      <p class="portal-help">Need access or forgot your password? <a href="mailto:firstwakemedia@gmail.com?subject=Client%20portal%20access">Email First Wake Media</a>.</p>
    </section>
  </main>

  <script type="module">
    import { supabase, currentUser } from "/portal.js";

    const form = document.querySelector("#login-form");
    const button = document.querySelector("#login-button");
    const magicLinkButton = document.querySelector("#magic-link-button");
    const accountModeButton = document.querySelector("#account-mode-button");
    const title = document.querySelector("#login-title");
    const copy = document.querySelector(".portal-copy");
    const status = document.querySelector("#login-status");
    const next = new URLSearchParams(window.location.search).get("next");
    const safeNext = next && next.startsWith("/") && !next.startsWith("//") ? next : "/dashboard";
    let creatingAccount = false;

    if (await currentUser()) window.location.replace(safeNext);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.dataset.kind = "";
      status.textContent = "Signing you in…";

      const values = new FormData(form);
      const email = values.get("email");
      const password = values.get("password");
      const { data, error } = creatingAccount
        ? await supabase.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: `${window.location.origin}/dashboard` }
          })
        : await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        status.dataset.kind = "error";
        status.textContent = creatingAccount
          ? (error.message || "We could not create that account.")
          : "That email or password did not work.";
        button.disabled = false;
        return;
      }

      if (creatingAccount && !data.session) {
        status.dataset.kind = "success";
        status.textContent = "Account created. Check your email to confirm it, then sign in.";
        button.textContent = "Account created";
        return;
      }

      window.location.replace(safeNext);
    });

    accountModeButton.addEventListener("click", () => {
      creatingAccount = !creatingAccount;
      title.textContent = creatingAccount ? "Create your account." : "Welcome back.";
      copy.textContent = creatingAccount
        ? "Use your email address and create a password with at least eight characters."
        : "Sign in with your password, or request a secure sign-in link by email.";
      button.textContent = creatingAccount ? "Create account" : "Sign in";
      accountModeButton.textContent = creatingAccount ? "Back to sign in" : "Create account";
      magicLinkButton.hidden = creatingAccount;
      status.textContent = "";
      status.dataset.kind = "";
    });

    magicLinkButton.addEventListener("click", async () => {
      const email = form.elements.email.value.trim();
      if (!email) {
        status.dataset.kind = "error";
        status.textContent = "Enter your email address first.";
        form.elements.email.focus();
        return;
      }

      magicLinkButton.disabled = true;
      status.dataset.kind = "";
      status.textContent = "Sending your secure sign-in link…";

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: `${window.location.origin}${safeNext}`,
          shouldCreateUser: false
        }
      });

      if (error) {
        status.dataset.kind = "error";
        status.textContent = "We could not send the sign-in link. Check the email address and try again.";
        magicLinkButton.disabled = false;
        return;
      }

      status.dataset.kind = "success";
      status.textContent = "Check your email and open the secure sign-in link.";
      magicLinkButton.textContent = "Sign-in link sent";
    });
  </script>
</body>
</html>
