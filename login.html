<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Login — First Wake Media</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/portal.css">
</head>
<body class="portal-body">
  <a class="skip-link" href="#main">Skip to login</a>
  <main class="portal-shell" id="main">
    <section class="portal-card" aria-labelledby="login-title">
      <a class="brand portal-brand" href="/">
        <img class="brand__mark" src="/logo-emblem.png" width="160" height="160" alt="">
        <span class="brand__name">First Wake<small>Media</small></span>
      </a>
      <span class="eyebrow">Client portal</span>
      <h1 id="login-title">Welcome back.</h1>
      <p class="portal-copy">Sign in with the email and password provided by First Wake Media.</p>

      <form class="portal-form" id="login-form">
        <div class="portal-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@yourbusiness.com">
        </div>
        <div class="portal-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
        </div>
        <button class="btn btn--primary btn--lg" type="submit" id="login-button">Sign in</button>
      </form>
      <p class="portal-status" id="login-status" role="status" aria-live="polite"></p>
      <p class="portal-help">Need access or forgot your password? <a href="mailto:firstwakemedia@gmail.com?subject=Client%20portal%20access">Email First Wake Media</a>.</p>
    </section>
  </main>

  <script type="module">
    import { supabase, currentUser } from "/portal.js";

    const form = document.querySelector("#login-form");
    const button = document.querySelector("#login-button");
    const status = document.querySelector("#login-status");
    const next = new URLSearchParams(window.location.search).get("next");
    const safeNext = next && next.startsWith("/") && !next.startsWith("//") ? next : "/dashboard";

    if (await currentUser()) window.location.replace(safeNext);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.dataset.kind = "";
      status.textContent = "Signing you in…";

      const values = new FormData(form);
      const { error } = await supabase.auth.signInWithPassword({
        email: values.get("email"),
        password: values.get("password")
      });

      if (error) {
        status.dataset.kind = "error";
        status.textContent = "That email or password did not work.";
        button.disabled = false;
        return;
      }

      window.location.replace(safeNext);
    });
  </script>
</body>
</html>
